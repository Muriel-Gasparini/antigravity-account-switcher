name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (e.g. v0.1.0)'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate Pre-Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          cache: true

      - name: Go Vet
        run: go vet ./...

      - name: Run Tests
        run: go test -v -timeout=3m ./...

  release:
    name: Build and Publish Release
    runs-on: ubuntu-latest
    needs: validate
    environment: os
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          cache: true

      - name: Set Release Metadata
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            INPUT_TAG="${{ github.event.inputs.tag }}"
            if [[ ! "$INPUT_TAG" =~ ^v[0-9] ]] || [[ "$INPUT_TAG" == *"/"* ]]; then
              echo "Error: manual tag must follow format 'v*' and not contain slashes (got '$INPUT_TAG')"
              exit 1
            fi
            VERSION="$INPUT_TAG"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Compile Multi-Platform Static Binaries
        run: |
          mkdir -p dist
          VERSION="${{ steps.vars.outputs.version }}"
          DATE="${{ steps.vars.outputs.date }}"
          COMMIT="${GITHUB_SHA::7}"

          LDFLAGS="-s -w -X main.Version=${VERSION} -X main.Commit=${COMMIT} -X main.Date=${DATE} -extldflags '-static'"

          TARGETS=(
            "linux/amd64/antigravity-account-switcher"
            "linux/arm64/antigravity-account-switcher"
            "darwin/amd64/antigravity-account-switcher"
            "darwin/arm64/antigravity-account-switcher"
            "windows/amd64/antigravity-account-switcher.exe"
            "windows/arm64/antigravity-account-switcher.exe"
          )

          for target in "${TARGETS[@]}"; do
            IFS="/" read -r GOOS GOARCH BIN_NAME <<< "$target"
            echo "==> Building for ${GOOS}/${GOARCH}..."
            OUTPUT_DIR="build/${GOOS}_${GOARCH}"
            mkdir -p "${OUTPUT_DIR}"
            
            CGO_ENABLED=0 GOOS="${GOOS}" GOARCH="${GOARCH}" go build -trimpath \
              -ldflags="${LDFLAGS}" \
              -o "${OUTPUT_DIR}/${BIN_NAME}" ./cmd/antigravity-account-switcher

            ARCHIVE_NAME="antigravity-account-switcher_${VERSION}_${GOOS}_${GOARCH}"
            if [ "${GOOS}" = "windows" ]; then
              (cd "${OUTPUT_DIR}" && zip -9 "../../dist/${ARCHIVE_NAME}.zip" "${BIN_NAME}")
            else
              tar -czf "dist/${ARCHIVE_NAME}.tar.gz" -C "${OUTPUT_DIR}" "${BIN_NAME}"
            fi
          done

      - name: Generate SHA256 Checksums
        run: |
          cd dist
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Generate AI Release Notes with Gemini
        id: ai_notes
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log "${PREV_TAG}..HEAD" --oneline)
          else
            COMMITS=$(git log -n 30 --oneline)
          fi

          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY is not configured. Falling back to default GitHub release notes."
            echo "has_ai=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          VERSION="${{ steps.vars.outputs.version }}"
          PROMPT="Você é um engenheiro de software sênior responsável pelo projeto open-source 'Antigravity Account Switcher' (supervisor local para Google Antigravity 2.0).
          Analise o histórico de commits abaixo para a versão ${VERSION} e gere Release Notes completos, profissionais e engajadores em Markdown:

          Commits da versão:
          ${COMMITS}

          Diretrizes de formatação:
          ## 🚀 O que há de novo na versão ${VERSION}
          (Escreva 1-2 parágrafos resumindo os principais marcos desta versão)

          ### ✨ Principais Recursos e Melhorias
          (Liste as funcionalidades com emojis e explicação de benefícios práticos)

          ### 🛡️ Correções de Bugs & Estabilidade
          (Destaque estabilizações, melhorias de concorrência ou resiliência)

          ### 📦 Instalação & Downloads
          (Explique como baixar o binário para a respectiva plataforma e verificar o sha256 via checksums.txt)

          ---
          *Release gerado com IA (Google Gemini 2.0 Flash).*
          "

          PAYLOAD=$(jq -n --arg prompt "$PROMPT" '{
            contents: [{ parts: [{ text: $prompt }] }],
            generationConfig: {
              temperature: 0.3
            }
          }')

          # Step 1: Attempt dynamic model discovery for this specific API key
          DETECTED_MODELS=()
          MODELS_RESP=$(curl -s --connect-timeout 5 --max-time 10 \
            "https://generativelanguage.googleapis.com/v1beta/models" \
            -H "x-goog-api-key: ${GEMINI_API_KEY}" 2>/dev/null || true)

          if [ -n "$MODELS_RESP" ]; then
            while IFS= read -r m; do
              [ -n "$m" ] && DETECTED_MODELS+=("$m")
            done < <(echo "$MODELS_RESP" | jq -r '.models[]? | select(.supportedGenerationMethods[]? == "generateContent") | .name' | grep -E "flash|pro" | sed 's|^models/||' 2>/dev/null || true)
          fi

          # Build candidates list: dynamically discovered models first, then common standard fallbacks
          CANDIDATE_MODELS=("${DETECTED_MODELS[@]}" "gemini-1.5-flash" "gemini-2.0-flash" "gemini-1.5-pro")

          # De-duplicate candidates while preserving order
          UNIQUE_MODELS=()
          for m in "${CANDIDATE_MODELS[@]}"; do
            [[ " ${UNIQUE_MODELS[*]} " =~ " ${m} " ]] || UNIQUE_MODELS+=("$m")
          done

          echo "Candidate models to try: ${UNIQUE_MODELS[*]}"

          for MODEL in "${UNIQUE_MODELS[@]}"; do
            echo "Attempting to generate release notes with ${MODEL}..."
            RESPONSE=$(curl -s --connect-timeout 5 --max-time 15 -w "\n%{http_code}" -X POST \
              "https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent" \
              -H "Content-Type: application/json" \
              -H "x-goog-api-key: ${GEMINI_API_KEY}" \
              -d "$PAYLOAD" 2>/dev/null || echo -e "\n000")

            HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
            BODY=$(echo "$RESPONSE" | sed '$d')

            if [ "$HTTP_CODE" = "200" ]; then
              AI_NOTES=$(echo "$BODY" | jq -r '.candidates[0].content.parts[0].text // empty')
              if [ -n "$AI_NOTES" ]; then
                echo "$AI_NOTES" > release_notes.md
                echo "has_ai=true" >> "$GITHUB_OUTPUT"
                echo "Successfully generated AI Release Notes with ${MODEL}!"
                exit 0
              fi
            fi
            echo "Model ${MODEL} returned HTTP ${HTTP_CODE}, trying next fallback..."
          done

          echo "Warning: All Gemini API model calls failed. Falling back to default release notes."
          echo "has_ai=false" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.vars.outputs.version }}
          body_path: ${{ steps.ai_notes.outputs.has_ai == 'true' && 'release_notes.md' || '' }}
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          generate_release_notes: ${{ steps.ai_notes.outputs.has_ai != 'true' }}
          draft: false
          prerelease: false
