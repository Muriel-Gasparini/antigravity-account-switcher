name: CI

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Code Quality & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          cache: true

      - name: Go Vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v1.64.6
          args: --timeout=5m

  test:
    name: Test with Race Detector
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          cache: true

      - name: Build Binary for Integration Tests
        run: make build

      - name: Run Tests (-race)
        run: |
          go test -v -race -timeout=5m -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Upload Coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.txt

  build:
    name: Build Pure-Go Static Binary
    runs-on: ubuntu-latest
    needs: [ lint, test ]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          cache: true

      - name: Compile Binary (CGO_ENABLED=0)
        run: |
          CGO_ENABLED=0 go build -v -trimpath \
            -ldflags="-s -w -X main.Version=${{ github.ref_name }} -X main.Commit=${{ github.sha }} -X main.Date=$(date -u +'%Y-%m-%dT%H:%M:%SZ') -extldflags '-static'" \
            -o bin/antigravity-account-switcher ./cmd/antigravity-account-switcher

      - name: Verify Static Binary
        run: |
          file bin/antigravity-account-switcher
          ./bin/antigravity-account-switcher version
          ./bin/antigravity-account-switcher --help

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v7
        with:
          name: antigravity-account-switcher-linux-amd64
          path: bin/antigravity-account-switcher
